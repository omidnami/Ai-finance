[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-finance"
version = "0.5.0"
description = "From-scratch CPU MLP for educational 15-minute financial direction experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "ta==0.11.0", "openpyxl>=3.1,<4", "xlrd>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["finance_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
